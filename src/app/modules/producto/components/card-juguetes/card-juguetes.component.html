<div class="row">
    <mat-card class="col" *ngFor="let producto of coleccionJuguetes" appearance="outlined">
        <mat-card-header>
          <div mat-card-avatar class="example-header-image"></div>
          <mat-card-title>{{producto.nombre}}</mat-card-title>
          <mat-card-subtitle>{{producto.precio}}</mat-card-subtitle>
        </mat-card-header>
        <img mat-card-image src="{{producto.imagen}}" alt="{{producto.alt}}" height="200px" width="200px">
        <mat-card-content>
          <p>
           {{producto.descripcion}}
          </p>
        </mat-card-content>
        <mat-card-actions>
          <button tipe="button" class="btn btn-outline-primary" data-bs-toggle="modal" 
          data-bs-target="#modalCardJuguetes" (click)="mostrarVer(producto)"
          mat-button>ver mas</button>
          <button mat-button>SHARE</button>
        </mat-card-actions>
      </mat-card>
      
</div>


<!-- Modal para ver mas informacion-->
<div class="modal fade" id="modalCardJuguetes" *ngIf="modalVisible" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">{{productoSeleccionado.nombre}}</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <img src="{{productoSeleccionado.imagen}}" alt="{{productoSeleccionado.alt}}" height="200px" width="200px">

        <div class="mb-3">
          {{productoSeleccionado.descripcion}}
        </div>

        <div class="mb-3">
          {{productoSeleccionado.precio}}
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Agregar al carrito</button>
      </div>
    </div>
  </div>
</div>
